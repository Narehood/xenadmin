name: Test Builds

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: msbuild XenAdmin.sln -t:restore

      - name: Build Release
        run: msbuild XenAdmin.sln -property:Configuration=Release -verbosity:minimal

      - name: Build Debug
        run: msbuild XenAdmin.sln -property:Configuration=Debug -verbosity:minimal

      - name: Build Avalonia UI preview shell
        run: dotnet build XcpNgCenter.Shell/XcpNgCenter.Shell.csproj -c Release --nologo

      - name: Publish Avalonia UI preview shell (self-contained win-x64)
        run: >
          dotnet publish XcpNgCenter.Shell/XcpNgCenter.Shell.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o artifacts/shell-win-x64
          --nologo

      - name: Run unit tests
        run: dotnet test XenCenterLib.Tests/XenCenterLib.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drop-release
          path: XenAdmin/bin/Release/net8.0-windows
          if-no-files-found: error

      - name: Upload Debug artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drop-debug
          path: XenAdmin/bin/Debug/net8.0-windows
          if-no-files-found: error

      - name: Upload Avalonia UI preview shell
        uses: actions/upload-artifact@v7
        with:
          name: drop-shell-win-x64
          path: artifacts/shell-win-x64
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
