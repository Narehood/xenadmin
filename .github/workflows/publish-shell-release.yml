name: Publish Shell Release

# Optional: publish a GitHub Release tagged vYYYY.M.D.N so the Avalonia shell
# update banner can be verified end-to-end. Trigger manually after soak.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "BuildRevision (non-negative integer). Prefer a value greater than any soak binary under test."
        required: true
        type: string
        default: "1"
      attach_artifacts:
        description: "Build and attach self-contained win-x64 zip + linux-x64 tar.gz"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark release as prerelease (update banner ignores prereleases)"
        required: true
        type: boolean
        default: false
      codename:
        description: "Optional build label shown in Settings → About (defaults to Local if omitted)"
        required: false
        type: string
        default: "Local"

permissions:
  contents: write

jobs:
  publish-windows:
    if: ${{ inputs.attach_artifacts }}
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      codename: ${{ steps.ver.outputs.codename }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate revision and compute version
        id: ver
        shell: pwsh
        run: |
          $rev = "${{ inputs.revision }}".Trim()
          if ($rev -notmatch '^\d+$') {
            throw "revision must be a non-negative integer (got '$rev')"
          }
          $utc = [DateTime]::UtcNow
          $version = "{0}.{1}.{2}.{3}" -f $utc.Year, $utc.Month, $utc.Day, $rev
          $tag = "v$version"
          $codename = "${{ inputs.codename }}".Trim()
          if ([string]::IsNullOrWhiteSpace($codename)) {
            $codename = "Local"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "revision=$rev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "codename=$codename" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing $tag ($codename)"

      - name: Publish Avalonia shell (win-x64)
        run: >
          dotnet publish XcpNgCenter.Shell/XcpNgCenter.Shell.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:BuildRevision=${{ steps.ver.outputs.revision }}
          -p:Codename=${{ steps.ver.outputs.codename }}
          -o artifacts/shell-win-x64
          --nologo

      - name: Zip win-x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path artifacts/shell-win-x64/* -DestinationPath "dist/XcpNgCenter.Shell-win-x64-$v.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: dist/*.zip
          if-no-files-found: error

  publish-linux:
    if: ${{ inputs.attach_artifacts }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      codename: ${{ steps.ver.outputs.codename }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate revision and compute version
        id: ver
        shell: bash
        run: |
          REV="${{ inputs.revision }}"
          REV="$(echo "$REV" | tr -d '[:space:]')"
          if ! [[ "$REV" =~ ^[0-9]+$ ]]; then
            echo "revision must be a non-negative integer (got '$REV')" >&2
            exit 1
          fi
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          VERSION="${YEAR}.${MONTH}.${DAY}.${REV}"
          TAG="v${VERSION}"
          CODENAME="$(echo "${{ inputs.codename }}" | tr -d '[:space:]')"
          if [[ -z "$CODENAME" ]]; then
            CODENAME="Local"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "codename=${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (${CODENAME})"

      - name: Publish Avalonia shell (linux-x64)
        run: >
          dotnet publish XcpNgCenter.Shell/XcpNgCenter.Shell.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:BuildRevision=${{ steps.ver.outputs.revision }}
          -p:Codename=${{ steps.ver.outputs.codename }}
          -o artifacts/shell-linux-x64
          --nologo

      - name: Tar linux-x64 (preserves executable bits)
        shell: bash
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          chmod +x artifacts/shell-linux-x64/XcpNgCenter.Shell || true
          tar -C artifacts/shell-linux-x64 -czf "dist/XcpNgCenter.Shell-linux-x64-${V}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [publish-windows, publish-linux]
    if: ${{ always() && inputs.attach_artifacts && needs.publish-windows.result == 'success' && needs.publish-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes from commits
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.publish-linux.outputs.tag }}"
          VERSION="${{ needs.publish-linux.outputs.version }}"
          CODENAME="${{ needs.publish-linux.outputs.codename }}"

          # Previous shell release tag (vYYYY.M.D.N), excluding the tag we are about to create.
          PREV="$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n1 || true)"

          {
            echo "## ${VERSION} (${CODENAME})"
            echo
            if [[ -n "$PREV" ]]; then
              echo "Changes since \`${PREV}\`:"
              echo
              # Prefer subject lines; skip merge commits and empty noise.
              git log "${PREV}..HEAD" --pretty=format:'- %s' --no-merges \
                | sed '/^$/d' \
                | head -n 80
              echo
              echo
              COUNT="$(git rev-list --count "${PREV}..HEAD" --no-merges || echo 0)"
              echo "_${COUNT} commit(s) since ${PREV}._"
            else
              echo "Changes in this build:"
              echo
              git log -n 40 --pretty=format:'- %s' --no-merges \
                | sed '/^$/d'
              echo
            fi
            echo
            echo "## Downloads"
            echo
            echo "- \`XcpNgCenter.Shell-win-x64-${VERSION}.zip\`"
            echo "- \`XcpNgCenter.Shell-linux-x64-${VERSION}.tar.gz\`"
          } > release-notes.md

          echo "Wrote release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-linux.outputs.tag }}
          name: XCP-ng Center Shell ${{ needs.publish-linux.outputs.version }} (${{ needs.publish-linux.outputs.codename }})
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: release-notes.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-notes-only:
    if: ${{ !inputs.attach_artifacts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate revision and compute version
        id: ver
        shell: bash
        run: |
          REV="${{ inputs.revision }}"
          REV="$(echo "$REV" | tr -d '[:space:]')"
          if ! [[ "$REV" =~ ^[0-9]+$ ]]; then
            echo "revision must be a non-negative integer (got '$REV')" >&2
            exit 1
          fi
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          VERSION="${YEAR}.${MONTH}.${DAY}.${REV}"
          TAG="v${VERSION}"
          CODENAME="$(echo "${{ inputs.codename }}" | tr -d '[:space:]')"
          if [[ -z "$CODENAME" ]]; then
            CODENAME="Local"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "codename=${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (${CODENAME})"

      - name: Build release notes from commits
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          CODENAME="${{ steps.ver.outputs.codename }}"
          PREV="$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n1 || true)"

          {
            echo "## ${VERSION} (${CODENAME})"
            echo
            if [[ -n "$PREV" ]]; then
              echo "Changes since \`${PREV}\`:"
              echo
              git log "${PREV}..HEAD" --pretty=format:'- %s' --no-merges \
                | sed '/^$/d' \
                | head -n 80
              echo
            else
              echo "Changes in this build:"
              echo
              git log -n 40 --pretty=format:'- %s' --no-merges \
                | sed '/^$/d'
              echo
            fi
            echo
            echo "CI artifacts: download \`drop-shell-linux-x64\` / \`drop-shell-win-x64\` from the Test Builds workflow on \`development\`."
          } > release-notes.md

      - name: Create GitHub Release (notes only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: XCP-ng Center Shell ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.codename }})
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
