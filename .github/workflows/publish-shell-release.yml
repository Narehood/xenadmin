name: Publish Shell Release

# Optional: publish a GitHub Release tagged vYYYY.M.D.N so the Avalonia shell
# update banner can be verified end-to-end. Trigger manually after soak.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "BuildRevision (non-negative integer). Prefer a value greater than any soak binary under test."
        required: true
        type: string
        default: "1"
      attach_artifacts:
        description: "Build and attach self-contained win-x64 zip + linux-x64 tar.gz"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Publish a beta prerelease (required on beta; regular releases use development)"
        required: true
        type: boolean
        default: false
      codename:
        description: "Optional build label shown in Settings → About (defaults to Awa if omitted)"
        required: false
        type: string
        default: "Awa"

permissions:
  contents: read

# Stable and beta share numeric version tags; serialize publication across both.
concurrency:
  group: publish-shell-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      revision: ${{ steps.ver.outputs.revision }}
      codename: ${{ steps.ver.outputs.codename }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release note generation
        run: python3 scripts/test-release-notes.py

      - name: Validate channel and select a unique version
        id: ver
        shell: pwsh
        env:
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_CODENAME: ${{ inputs.codename }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $beta = $env:INPUT_PRERELEASE -eq 'true'
          $expectedRef = if ($beta) { 'refs/heads/beta' } else { 'refs/heads/development' }
          if ($env:GITHUB_REF -ne $expectedRef) {
            throw "Select beta with prerelease enabled, or development with prerelease disabled."
          }
          $revision = 0
          if ($env:INPUT_REVISION.Trim() -notmatch '^\d+$' -or
              ![int]::TryParse($env:INPUT_REVISION.Trim(), [ref]$revision) -or $revision -gt 65534) {
            throw 'revision must be an integer between 0 and 65534.'
          }
          $utc = [DateTime]::UtcNow
          $version = [Version]::new($utc.Year, $utc.Month, $utc.Day, $revision)
          $tag = "v$version"
          $tags = @(git tag -l 'v*')
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing release tags.' }
          foreach ($existing in $tags) {
            if ($existing -match '^v\d+\.\d+\.\d+\.\d+$' -and [Version]::Parse($existing.Substring(1)) -ge $version) {
              throw "Version $version must exceed existing tag $existing. Choose a higher revision."
            }
          }
          $codename = $env:INPUT_CODENAME.Trim()
          if ($codename -match "[\r\n]") { throw 'codename must be a single line.' }
          if (!$codename) { $codename = 'Awa' }
          "version=$version", "tag=$tag", "revision=$revision", "codename=$codename" >> $env:GITHUB_OUTPUT

  publish-windows:
    needs: prepare
    if: ${{ inputs.attach_artifacts }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked source dependencies
        run: dotnet restore XcpNgCenter.Shell/XcpNgCenter.Shell.csproj --locked-mode

      - name: Publish and package Avalonia shell (win-x64)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_CODENAME: ${{ needs.prepare.outputs.codename }}
        run: ./scripts/Publish-Shell.ps1 -RuntimeIdentifier win-x64 -ArchivePath "dist/XcpNgCenter.Shell-win-x64-$env:RELEASE_VERSION.zip" -BuildRevision $env:RELEASE_REVISION -Codename $env:RELEASE_CODENAME -ReleaseVersion $env:RELEASE_VERSION

      - name: Verify packaged Windows executable
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/verify-shell-package.py --archive "dist/XcpNgCenter.Shell-win-x64-$env:RELEASE_VERSION.zip" --rid win-x64 --evidence-directory artifacts/smoke-windows

      - name: Confirm checked-in lockfiles were preserved
        run: git diff --exit-code -- '*/packages.lock.json'

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-windows
          path: artifacts/smoke-windows
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: dist/*.zip
          if-no-files-found: error

  publish-linux:
    needs: prepare
    if: ${{ inputs.attach_artifacts }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install native desktop smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool openbox x11-utils libice6 libsm6 libfontconfig1

      - name: Restore locked source dependencies
        run: dotnet restore XcpNgCenter.Shell/XcpNgCenter.Shell.csproj --locked-mode

      - name: Publish and package Avalonia shell (linux-x64)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_CODENAME: ${{ needs.prepare.outputs.codename }}
        run: ./scripts/Publish-Shell.ps1 -RuntimeIdentifier linux-x64 -ArchivePath "dist/XcpNgCenter.Shell-linux-x64-$env:RELEASE_VERSION.tar.gz" -BuildRevision $env:RELEASE_REVISION -Codename $env:RELEASE_CODENAME -ReleaseVersion $env:RELEASE_VERSION

      - name: Verify packaged Linux executable and native desktop startup
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: xvfb-run -a python3 scripts/verify-shell-package.py --archive "dist/XcpNgCenter.Shell-linux-x64-$RELEASE_VERSION.tar.gz" --rid linux-x64 --evidence-directory artifacts/smoke-linux --desktop --window-manager

      - name: Confirm checked-in lockfiles were preserved
        run: git diff --exit-code -- '*/packages.lock.json'

      - name: Upload Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-linux
          path: artifacts/smoke-linux
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    # Build and smoke jobs use read-only tokens; only publication needs write access.
    permissions:
      contents: write
    needs: [prepare, publish-windows, publish-linux]
    if: ${{ always() && inputs.attach_artifacts && needs.publish-windows.result == 'success' && needs.publish-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*-x64
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CODENAME: ${{ needs.prepare.outputs.codename }}
        run: python scripts/generate-release-notes.py --version "$env:RELEASE_VERSION" --codename "$env:RELEASE_CODENAME" --output release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: XCP-ng Center Shell ${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.codename }})
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: release-notes.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-notes-only:
    permissions:
      contents: write
    needs: prepare
    if: ${{ !inputs.attach_artifacts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Generate release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CODENAME: ${{ needs.prepare.outputs.codename }}
        run: python scripts/generate-release-notes.py --version "$env:RELEASE_VERSION" --codename "$env:RELEASE_CODENAME" --notes-only --output release-notes.md

      - name: Create GitHub Release (notes only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: XCP-ng Center Shell ${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.codename }})
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
