name: Publish Shell Release

# Optional: publish a GitHub Release tagged vYYYY.M.D.N so the Avalonia shell
# update banner can be verified end-to-end. Trigger manually after soak.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "BuildRevision (non-negative integer). Prefer a value greater than any soak binary under test."
        required: true
        type: string
        default: "1"
      attach_artifacts:
        description: "Build and attach self-contained win-x64 zip + linux-x64 tar.gz"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark release as prerelease (update banner ignores prereleases)"
        required: true
        type: boolean
        default: false
      codename:
        description: "Optional build label shown in Settings → About (defaults to Awa if omitted)"
        required: false
        type: string
        default: "Awa"

permissions:
  contents: write

jobs:
  publish-windows:
    if: ${{ inputs.attach_artifacts }}
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      codename: ${{ steps.ver.outputs.codename }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate revision and compute version
        id: ver
        shell: pwsh
        env:
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_CODENAME: ${{ inputs.codename }}
        run: |
          $rev = $env:INPUT_REVISION.Trim()
          if ($rev -notmatch '^\d+$') {
            throw "revision must be a non-negative integer (got '$rev')"
          }
          $utc = [DateTime]::UtcNow
          $version = "{0}.{1}.{2}.{3}" -f $utc.Year, $utc.Month, $utc.Day, $rev
          $tag = "v$version"
          $codename = $env:INPUT_CODENAME.Trim()
          if ($codename -match "[\r\n]") { throw "codename must be a single line" }
          if ([string]::IsNullOrWhiteSpace($codename)) {
            $codename = "Awa"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "revision=$rev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "codename=$codename" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing $tag ($codename)"

      - name: Restore locked source dependencies
        run: dotnet restore XcpNgCenter.Shell/XcpNgCenter.Shell.csproj --locked-mode

      - name: Publish and package Avalonia shell (win-x64)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_REVISION: ${{ steps.ver.outputs.revision }}
          RELEASE_CODENAME: ${{ steps.ver.outputs.codename }}
        run: ./scripts/Publish-Shell.ps1 -RuntimeIdentifier win-x64 -ArchivePath "dist/XcpNgCenter.Shell-win-x64-$env:RELEASE_VERSION.zip" -BuildRevision $env:RELEASE_REVISION -Codename $env:RELEASE_CODENAME

      - name: Verify packaged Windows executable
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: python scripts/verify-shell-package.py --archive "dist/XcpNgCenter.Shell-win-x64-$env:RELEASE_VERSION.zip" --rid win-x64 --evidence-directory artifacts/smoke-windows

      - name: Confirm checked-in lockfiles were preserved
        run: git diff --exit-code -- '*/packages.lock.json'

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-windows
          path: artifacts/smoke-windows
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: dist/*.zip
          if-no-files-found: error

  publish-linux:
    if: ${{ inputs.attach_artifacts }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      codename: ${{ steps.ver.outputs.codename }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install native desktop smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool libice6 libsm6 libfontconfig1

      - name: Validate revision and compute version
        id: ver
        shell: bash
        env:
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_CODENAME: ${{ inputs.codename }}
        run: |
          REV="$INPUT_REVISION"
          REV="$(echo "$REV" | tr -d '[:space:]')"
          if ! [[ "$REV" =~ ^[0-9]+$ ]]; then
            echo "revision must be a non-negative integer (got '$REV')" >&2
            exit 1
          fi
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          VERSION="${YEAR}.${MONTH}.${DAY}.${REV}"
          TAG="v${VERSION}"
          CODENAME="$(printf '%s' "$INPUT_CODENAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$CODENAME" == *$'\n'* || "$CODENAME" == *$'\r'* ]]; then
            echo "codename must be a single line" >&2
            exit 1
          fi
          if [[ -z "$CODENAME" ]]; then
            CODENAME="Awa"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "codename=${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (${CODENAME})"

      - name: Restore locked source dependencies
        run: dotnet restore XcpNgCenter.Shell/XcpNgCenter.Shell.csproj --locked-mode

      - name: Publish and package Avalonia shell (linux-x64)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_REVISION: ${{ steps.ver.outputs.revision }}
          RELEASE_CODENAME: ${{ steps.ver.outputs.codename }}
        run: ./scripts/Publish-Shell.ps1 -RuntimeIdentifier linux-x64 -ArchivePath "dist/XcpNgCenter.Shell-linux-x64-$env:RELEASE_VERSION.tar.gz" -BuildRevision $env:RELEASE_REVISION -Codename $env:RELEASE_CODENAME

      - name: Verify packaged Linux executable and native desktop startup
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: xvfb-run -a python3 scripts/verify-shell-package.py --archive "dist/XcpNgCenter.Shell-linux-x64-$RELEASE_VERSION.tar.gz" --rid linux-x64 --evidence-directory artifacts/smoke-linux --desktop

      - name: Confirm checked-in lockfiles were preserved
        run: git diff --exit-code -- '*/packages.lock.json'

      - name: Upload Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-linux
          path: artifacts/smoke-linux
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [publish-windows, publish-linux]
    if: ${{ always() && inputs.attach_artifacts && needs.publish-windows.result == 'success' && needs.publish-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*-x64
          path: dist
          merge-multiple: true

      - name: Build release notes from commits
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.publish-linux.outputs.tag }}
          RELEASE_VERSION: ${{ needs.publish-linux.outputs.version }}
          RELEASE_CODENAME: ${{ needs.publish-linux.outputs.codename }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          CODENAME="$RELEASE_CODENAME"

          # Previous shell release tag (vYYYY.M.D.N), excluding the tag we are about to create.
          PREV="$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n1 || true)"

          {
            echo "## ${VERSION} (${CODENAME})"
            echo
            if [[ -n "$PREV" ]]; then
              echo "Changes since \`${PREV}\`:"
              echo
              # Prefer subject lines; skip merge commits and empty noise.
              git log "${PREV}..HEAD" --pretty=format:'- %s' --no-merges \
                | sed '/^$/d' \
                | head -n 80
              echo
              echo
              COUNT="$(git rev-list --count "${PREV}..HEAD" --no-merges || echo 0)"
              echo "_${COUNT} commit(s) since ${PREV}._"
            else
              echo "Changes in this build:"
              echo
              git log -n 40 --pretty=format:'- %s' --no-merges \
                | sed '/^$/d'
              echo
            fi
            echo
            echo "## Downloads"
            echo
            echo "- \`XcpNgCenter.Shell-win-x64-${VERSION}.zip\`"
            echo "- \`XcpNgCenter.Shell-linux-x64-${VERSION}.tar.gz\`"
          } > release-notes.md

          echo "Wrote release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-linux.outputs.tag }}
          name: XCP-ng Center Shell ${{ needs.publish-linux.outputs.version }} (${{ needs.publish-linux.outputs.codename }})
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: release-notes.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-notes-only:
    if: ${{ !inputs.attach_artifacts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate revision and compute version
        id: ver
        shell: bash
        env:
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_CODENAME: ${{ inputs.codename }}
        run: |
          REV="$INPUT_REVISION"
          REV="$(echo "$REV" | tr -d '[:space:]')"
          if ! [[ "$REV" =~ ^[0-9]+$ ]]; then
            echo "revision must be a non-negative integer (got '$REV')" >&2
            exit 1
          fi
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          VERSION="${YEAR}.${MONTH}.${DAY}.${REV}"
          TAG="v${VERSION}"
          CODENAME="$(printf '%s' "$INPUT_CODENAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$CODENAME" == *$'\n'* || "$CODENAME" == *$'\r'* ]]; then
            echo "codename must be a single line" >&2
            exit 1
          fi
          if [[ -z "$CODENAME" ]]; then
            CODENAME="Awa"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "codename=${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (${CODENAME})"

      - name: Build release notes from commits
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_CODENAME: ${{ steps.ver.outputs.codename }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          CODENAME="$RELEASE_CODENAME"
          PREV="$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n1 || true)"

          {
            echo "## ${VERSION} (${CODENAME})"
            echo
            if [[ -n "$PREV" ]]; then
              echo "Changes since \`${PREV}\`:"
              echo
              git log "${PREV}..HEAD" --pretty=format:'- %s' --no-merges \
                | sed '/^$/d' \
                | head -n 80
              echo
            else
              echo "Changes in this build:"
              echo
              git log -n 40 --pretty=format:'- %s' --no-merges \
                | sed '/^$/d'
              echo
            fi
            echo
            echo "CI artifacts: download \`drop-shell-linux-x64\` / \`drop-shell-win-x64\` from the Test Builds workflow on \`development\`."
          } > release-notes.md

      - name: Create GitHub Release (notes only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: XCP-ng Center Shell ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.codename }})
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
